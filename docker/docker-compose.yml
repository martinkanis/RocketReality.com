services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: rocketreality-postgres
    environment:
      POSTGRES_USER: rocket
      POSTGRES_PASSWORD: rocket
      POSTGRES_DB: rocketreality
    ports:
      - '5442:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rocket -d rocketreality']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rocketreality-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rocket
      MINIO_ROOT_PASSWORD: rocketreality
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 rocket rocketreality; do sleep 1; done;
      mc mb --ignore-existing local/rocketreality;
      mc anonymous set download local/rocketreality;
      exit 0"

  mailpit:
    image: axllent/mailpit:latest
    container_name: rocketreality-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
